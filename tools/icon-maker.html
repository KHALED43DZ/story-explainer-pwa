<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>صانع أيقونات التطبيق</title>
<style>body{font-family:system-ui,sans-serif;max-width:560px;margin:0 auto;padding:18px;background:#f6f4ee;color:#1f2a37}
h1{font-size:1.2rem}label,button,input{font:inherit}button,.btn{display:inline-block;padding:10px 14px;border-radius:10px;border:0;background:#2563eb;color:#fff;margin:4px 0;cursor:pointer;text-decoration:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}canvas{width:96px;height:96px;border:1px solid #ddd;border-radius:16px;background:#fff}
.card{background:#fff;border-radius:14px;padding:14px;margin:12px 0}small{color:#6b7280}</style></head><body>
<h1>🖼 صانع أيقونات التطبيق من شعار القناة</h1>
<div class="card"><p>1) اختر صورة الشعار (يفضّل مربعة، PNG).</p>
<input id="f" type="file" accept="image/*">
<div class="row"><label>لون الخلفية: <input id="bg" type="color" value="#0a2463"></label>
<label>حجم الشعار داخل الأيقونة: <input id="sz" type="range" min="50" max="100" value="86"></label></div></div>
<div class="card"><p>2) عاين ثم نزّل الأيقونات الأربع.</p>
<div class="row" id="prev"></div><div class="row" id="dl"></div>
<small>ضع الملفات الأربعة في المجلد icons داخل المشروع واستبدل الموجود بنفس الأسماء.</small></div>
<script>
const SPEC=[["icon-192.png",192,1],["icon-512.png",512,1],["icon-maskable-512.png",512,.7],["apple-touch-icon.png",180,1]];
let img=null;const $=i=>document.getElementById(i);
function draw(size,k){const c=document.createElement("canvas");c.width=c.height=size;const x=c.getContext("2d");
  x.fillStyle=$("bg").value;x.fillRect(0,0,size,size);if(!img)return c;
  const box=size*k*($("sz").value/100),m=Math.min(img.width,img.height);
  // قصّ مربع من مركز الصورة ثم رسمه في المنتصف
  x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,(size-box)/2,(size-box)/2,box,box);return c}
function render(){$("prev").innerHTML="";$("dl").innerHTML="";
  SPEC.forEach(([name,size,k])=>{const c=draw(size,k);$("prev").appendChild(c);
    const b=document.createElement("button");b.textContent="تحميل "+name;b.onclick=()=>c.toBlob(bl=>{const a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download=name;a.click()},"image/png");$("dl").appendChild(b)})}
$("f").onchange=e=>{const f=e.target.files[0];if(!f)return;const i=new Image();i.onload=()=>{img=i;render()};i.src=URL.createObjectURL(f)};
$("bg").oninput=$("sz").oninput=render;render();
</script></body></html>
